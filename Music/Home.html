<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="./Home.css" />
        <title >MUSIC STREAMING WEBSITE</title>
    </head>
    <body>
        <div class="top">
            <nav class="Logo">
                <ul>
                    <li class="logo"><img src="logo1.png" alt="Verve">Verve</li>
                </ul>
            </nav>
            <nav>
                <ul>
                    <li><a href="MP2.html">Main Page</a></li>
                    <li><a href="Discover">Discover</a></li>
                </ul>
            </nav>
        </div>
        <div class="container">
            <div class="menu_side">
                <h1>Playlist</h1>
                <div class="playlist">
                    <h4 class="active"><span></span><i class="bi bi-music-note-beamed"></i> Playlist</h4>         
                    <h4><span></span><i class="bi bi-music-note-beamed"></i> Last Listening</h4>         
                    <h4><span></span><i class="bi bi-music-note-beamed"></i> Recomended</h4>         
                </div>
                <div class="menu_song">
                    <li class="songItem">
                        <span>01</span>
                        <img src="img1.png" alt="Alan ">
                        <h5>On My Way <br>
                            <div class="subtitle">Alan Walker</div>   
                            <i class="bi playListPlay bi-play-circle-fill" id="1"></i>
                        </h5>
                    </li>
                </div>
            </div>
        </div>
        <section>
            <h2>Jump back in</h2>
        </section>

        <section>
            <h2>Recently played</h2>
        </section>

        <section>
            <h2>Your playlists</h2>
        </section>
        </div>
        <div class="bottom">
            <div class="progressBar">
                <input type="range" name="range" id="myProgressBar" min="0" max="100">
                <div class="progress_bar"></div>
                <div class="dot" id="progress_dot"></div>
            </div>
            <div class="icons">
                <i class="bi bi-skip-start-fill"></i>
                <i class="bi bi-play-fill"></i>
                <i class="bi bi-skip-end-fill"></i>
            </div>
            <div class="songInfo">
                    <img src="c:\Users\User\Desktop\Internship\Py\Music Streaming Website\git\MSW\Music\audio.gif" id="masterPlay">   Current Song
            </div>
            <div class="vol">
                <i class="bi bi-volume-down-fill"></i>
                <input type="range" id="seek" min="0" value="30" max="100">
                <div class="vol_bar"></div>
                <div class="dot" id="vol_dot"></div>
            </div>
        </div>
    </body>
    <footer><p>All rights reserved.</p></footer>
